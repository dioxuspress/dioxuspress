[package]
name = "module-ai"
version = "0.2.0"
edition = "2021"
description = "Rust AI 内容板块与 LLM 架构可视化器（HuggingFace / ModelScope）"

[dependencies]
app-core = { path = "../../core" }
board = { path = "../../board" }
chrono = { workspace = true, optional = true }
dioxus = { workspace = true, features = ["fullstack", "router"] }
dioxus-shadcn = { workspace = true, features = ["badge", "button", "card", "input", "spinner", "tabs", "textarea"] }
dotenvy = { version = "0.15", optional = true }
llm = { path = "../../llm", optional = true }
reqwest = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
widgets = { path = "../../widgets" }

[dev-dependencies]
dioxus-ssr = "0.7.9"

[features]
accounts = []
server = [
  "app-core/server",
  "board/server",
  "dep:chrono",
  "dep:llm",
  "dep:reqwest",
  "dep:sea-orm",
  "dep:serde_yaml",
  "dep:tokio",
  "dioxus/server",
  "widgets/server",
]
# 每日开源模型架构核验与新架构巡检 CLI（服务器 cron 跑，主应用与 WASM 绝不链接）
audit = [
  "server",
  "dep:dotenvy",
  "dep:tracing-subscriber",
]

[[bin]]
name = "models-audit"
path = "src/bin/models_audit.rs"
required-features = ["audit"]

[lints]
workspace = true
