[package]
name = "dioxuspress-cli"
version = "0.1.0"
edition = "2021"
description = "Lightweight official CLI for DioxusPress: scaffold sites (`init`) and statically verify content & site.json (`check`)."

[[bin]]
name = "dioxuspress"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pulldown-cmark = { version = "0.13.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
tempfile = "3"
